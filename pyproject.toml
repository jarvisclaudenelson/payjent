[project]
name = "payjent"
version = "0.1.0"
description = "Mock paid-request gateway skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "sqlmodel>=0.0.16",
  "uvicorn>=0.27",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "psycopg[binary]>=3",
  "workos>=5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
stripe = ["stripe>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
